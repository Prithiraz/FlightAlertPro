<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlightAlertPro</title>
    <style>
      /* ── Reset & base ─────────────────────────────────────────── */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 340px;
        font-family: "Google Sans", "Roboto", Arial, sans-serif;
        background: #f8f9fa;
        color: #202124;
        min-height: 480px;
      }

      /* ── Header ───────────────────────────────────────────────── */
      .header {
        background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
        padding: 22px 20px 18px;
        text-align: center;
        color: #fff;
      }

      .header .logo {
        font-size: 32px;
        line-height: 1;
        margin-bottom: 6px;
      }

      .header h1 {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.01em;
      }

      .header p {
        font-size: 12px;
        opacity: 0.85;
        margin-top: 4px;
      }

      /* ── Card ─────────────────────────────────────────────────── */
      .card {
        background: #ffffff;
        margin: 16px;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.1);
      }

      /* ── Form ─────────────────────────────────────────────────── */
      .form-group {
        margin-bottom: 14px;
      }

      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: #5f6368;
        margin-bottom: 5px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      input[type="email"],
      input[type="password"] {
        width: 100%;
        padding: 10px 12px;
        border: 1.5px solid #dadce0;
        border-radius: 8px;
        font-size: 14px;
        color: #202124;
        background: #fff;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
        outline: none;
      }

      input[type="email"]:focus,
      input[type="password"]:focus {
        border-color: #1a73e8;
        box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.18);
      }

      /* ── Submit button ────────────────────────────────────────── */
      .btn-primary {
        display: block;
        width: 100%;
        padding: 11px 0;
        background: #1a73e8;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.1s ease;
        margin-top: 4px;
        letter-spacing: 0.02em;
      }

      .btn-primary:hover:not(:disabled) {
        background: #1558b0;
      }

      .btn-primary:active:not(:disabled) {
        transform: scale(0.97);
      }

      .btn-primary:disabled {
        opacity: 0.65;
        cursor: not-allowed;
      }

      /* ── Status / error messages ──────────────────────────────── */
      #status-msg {
        font-size: 13px;
        margin-top: 12px;
        min-height: 20px;
        text-align: center;
        line-height: 1.4;
      }

      #status-msg.success {
        color: #188038;
        font-weight: 600;
      }

      #status-msg.error {
        color: #d93025;
      }

      /* ── Logged-in view ───────────────────────────────────────── */
      #logged-in-view {
        display: none;
        text-align: center;
      }

      #logged-in-view .user-avatar {
        font-size: 40px;
        margin-bottom: 8px;
      }

      #logged-in-view .user-email {
        font-size: 13px;
        color: #5f6368;
        word-break: break-all;
        margin-bottom: 16px;
      }

      #logged-in-view .user-greeting {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 4px;
        color: #202124;
      }

      .btn-secondary {
        display: block;
        width: 100%;
        padding: 9px 0;
        background: transparent;
        color: #1a73e8;
        font-size: 13px;
        font-weight: 600;
        border: 1.5px solid #1a73e8;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.2s ease;
        margin-top: 8px;
      }

      .btn-secondary:hover {
        background: rgba(26, 115, 232, 0.06);
      }

      /* ── Footer ───────────────────────────────────────────────── */
      .footer {
        text-align: center;
        font-size: 11px;
        color: #9aa0a6;
        padding: 0 16px 16px;
      }

      .footer a {
        color: #1a73e8;
        text-decoration: none;
      }

      .footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <div class="header">
      <div class="logo">✈</div>
      <h1>FlightAlertPro</h1>
      <p>Price drop alerts for Google Flights</p>
    </div>

    <!-- Login view -->
    <div class="card" id="login-view">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        />
      </div>

      <button class="btn-primary" id="login-btn" type="button">Sign In</button>

      <p id="status-msg" aria-live="polite"></p>
    </div>

    <!-- Logged-in view -->
    <div class="card" id="logged-in-view">
      <div class="user-avatar">👤</div>
      <p class="user-greeting">Welcome back!</p>
      <p class="user-email" id="display-email"></p>
      <button class="btn-secondary" id="logout-btn" type="button">Sign Out</button>
    </div>

    <!-- Footer -->
    <div class="footer">
      <a href="https://flightalertpro.com" target="_blank" rel="noopener">flightalertpro.com</a>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
