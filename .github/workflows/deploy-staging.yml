name: Deploy – Staging

on:
  push:
    branches: [main]

# Prevent concurrent staging deploys
concurrency:
  group: deploy-staging
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-backend-staging:
    name: Deploy backend → Railway (staging)
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Deploy to Railway staging
        run: railway up --service backend --environment staging --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-frontend-staging:
    name: Deploy frontend → Vercel (preview)
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Deploy to Vercel (staging preview)
        run: |
          cd frontend
          npx vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
          npx vercel build --token=$VERCEL_TOKEN
          npx vercel deploy --prebuilt --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  smoke-test-staging:
    name: Smoke test staging
    runs-on: ubuntu-latest
    needs: [deploy-backend-staging, deploy-frontend-staging]
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Run smoke tests
        run: bash scripts/smoke_test.sh
        env:
          SMOKE_BASE_URL: ${{ vars.STAGING_BACKEND_URL }}
