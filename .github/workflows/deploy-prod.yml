name: Deploy – Production

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for this production deployment
        required: true
        default: Release
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# Prevent concurrent production deploys
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-backend-prod:
    name: Deploy backend → Railway (production)
    runs-on: ubuntu-latest
    environment: production        # requires manual approval in GitHub Environments
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Deploy to Railway production
        run: railway up --service backend --environment production --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-frontend-prod:
    name: Deploy frontend → Vercel (production)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Deploy to Vercel (production)
        run: |
          cd frontend
          npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          npx vercel build --prod --token=$VERCEL_TOKEN
          npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  smoke-test-prod:
    name: Smoke test production
    runs-on: ubuntu-latest
    needs: [deploy-backend-prod, deploy-frontend-prod]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Run smoke tests
        run: bash scripts/smoke_test.sh
        env:
          SMOKE_BASE_URL: ${{ vars.PROD_BACKEND_URL }}
